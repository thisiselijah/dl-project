[project]
name = "dl-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mmcv-lite>=2.0.0,<3.0.0",
    "mmengine>=0.4.0,<1.0.0",
    "mmpose==1.3.2",
    "torch>=2.15.0",
    "ultralytics>=8.4.216",
]

[project.scripts]
dl-project = "dl_project:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
exclude-dependencies = ["chumpy"]   

[tool.uv.extra-build-dependencies]
xtcocotools = ["numpy", "cython"]  
